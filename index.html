<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <h3>Your ID: <span id="my-id">...</span></h3>
    <input type="text" id="remote-id" placeholder="Remote Peer ID">
    <button onclick="startCall()">Call</button>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <div><p>Local</p><video id="local-video" width="300" autoplay muted></video></div>
        <div><p>Remote</p><video id="remote-video" width="300" autoplay></video></div>
    </div>

    <script>
       const peer = new Peer({
            config: {
                'iceServers': [
                    { url: 'stun:://google.com' },
                    { url: 'stun:://google.com' }
                ]
            }
        });
        let localStream;

        // 1. Get SCREEN capture instead of camera
        async function startCapture() {
            try {
                // This triggers the "Select a tab/window" popup
                localStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Error sharing screen: " + err);
            }
        }

        // Start the capture prompt immediately
        startCapture();

        // 2. Display your ID
        peer.on("open", id => {
            document.getElementById("my-id").innerText = id;
        });

        // 3. ANSWER CALL: Use screen stream to answer
        peer.on("call", call => {
            call.answer(localStream); 
            call.on("stream", remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });

        // 4. START CALL: Same logic as before
        function startCall() {
            const destId = document.getElementById("remote-id").value;
            if (!localStream) {
                alert("Wait for screen share to initialize");
                return;
            }
            const call = peer.call(destId, localStream);
            call.on("stream", remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }

    </script>
</body>
</html>
