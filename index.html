<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Secure Screen Share</title>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <h3>Your ID: <span id="my-id">...</span></h3>
    <input type="text" id="remote-id" placeholder="Paste Remote ID here">
    <!-- CRITICAL: User must click a button to share screen on HTTPS -->
    <button onclick="makeCall()">Start Screen Share Call</button>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <div><p>Local Screen</p><video id="local-video" width="400" autoplay muted></video></div>
        <div><p>Remote Screen</p><video id="remote-video" width="400" autoplay></video></div>
    </div>

    <script>
        // 1. Force PeerJS to use Secure HTTPS settings for GitHub Pages
        const peer = new Peer({
            secure: true,
            port: 443,
            config: {
                iceServers: [
                    { urls: 'stun:://google.com' },
                    { urls: 'stun:://twilio.com' }
                ]
            }
        });

        let localStream;

        // 2. Display your ID when ready
        peer.on('open', id => document.getElementById("my-id").innerText = id);

        // 3. RECIEVING: Must handle incoming calls
        peer.on('call', async (call) => {
            if (confirm("Inbound call. Do you want to share your screen back?")) {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('local-video').srcObject = localStream;
                call.answer(localStream);
                setupStreamDisplay(call);
            }
        });

        // 4. CALLING: Start screen share ONLY when button is clicked
        async function makeCall() {
            const destId = document.getElementById("remote-id").value;
            if (!destId) return alert("Please enter a Remote ID");

            try {
                // Browser requires this inside a click event
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('local-video').srcObject = localStream;

                const call = peer.call(destId, localStream);
                setupStreamDisplay(call);
            } catch (err) {
                alert("Screen share failed: " + err.message);
            }
        }

        function setupStreamDisplay(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }
    </script>
</body>
</html>
