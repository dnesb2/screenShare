<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <h3>Your ID: <span id="my-id">...</span></h3>
    <input type="text" id="remote-id" placeholder="Remote Peer ID">
    <button onclick="startCall()">Call</button>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <div><p>Local</p><video id="local-video" width="300" autoplay muted></video></div>
        <div><p>Remote</p><video id="remote-video" width="300" autoplay></video></div>
    </div>

    <script>
       const peer = new Peer({
            config: {
                'iceServers': [
                    { urls: 'stun:://google.com' },
                    { 
                        urls: 'turn:relay.metered.ca:443', 
                        username: 'metered', 
                        credential: 'password' 
                    }
                ],
                'iceTransportPolicy': 'relay' // THIS FORCES IT TO WORK THROUGH FIREWALLS
            }
        });
        // Monitor the connection to the signaling server
        peer.on('disconnected', () => {
            console.log("Connection lost. Attempting to reconnect...");
            peer.reconnect();
        });
        
        // Periodic Heartbeat (Keeps the connection alive)
        setInterval(() => {
            if (peer.open) {
                peer.socket.send({ type: 'HEARTBEAT' });
            }
        }, 5000); 
        
        let localStream;
        
        async function startCapture() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Error sharing screen: " + err);
            }
        }
        
        startCapture();
        
        peer.on("open", id => {
            document.getElementById("my-id").innerText = id;
        });
        
        // Error handling for the Peer connection
        peer.on('error', (err) => {
            console.error("PeerJS Error:", err.type, err);
            alert("Peer Error: " + err.type);
        });
        
        peer.on("call", call => {
            // Only answer if we have a stream
            if (localStream) {
                call.answer(localStream); 
                call.on("stream", remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            }
        });
        
        function startCall() {
            const destId = document.getElementById("remote-id").value;
            
            if (!localStream) {
                alert("Wait for screen share to initialize");
                return;
            }
            if (!destId) {
                alert("Enter a Remote ID first");
                return;
            }
        
            const call = peer.call(destId, localStream);
            
            // Safety check: ensure call object was created successfully
            if (call) {
                call.on("stream", remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            } else {
                console.error("Call object was not created. Check if ID is valid.");
            }
        }

    </script>
</body>
</html>
