<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <h3>Your ID: <span id="my-id">...</span></h3>
    <input type="text" id="remote-id" placeholder="Remote Peer ID">
    <button onclick="startCall()">Call</button>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <div><p>Local</p><video id="local-video" width="300" autoplay muted></video></div>
        <div><p>Remote</p><video id="remote-video" width="300" autoplay></video></div>
    </div>

    <script>
       // 1. Setup Peer with HTTPS settings
        const peer = new Peer({
            secure: true, 
            port: 443,
            config: {
                iceServers: [{ urls: 'stun:://google.com' }]
            }
        });
        
        let localStream;
        
        // 2. YOU MUST CLICK TO START (Browser Security Rule)
        async function getStream() {
            if (localStream) return localStream;
            // This MUST happen inside a click event on HTTPS
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('local-video').srcObject = localStream;
            return localStream;
        }
        
        peer.on('open', id => document.getElementById("my-id").innerText = id);
        
        // 3. RECEIVING A CALL
        peer.on("call", async (call) => {
            // We must get the stream first or answering will fail
            const stream = await getStream();
            call.answer(stream);
            call.on("stream", remote => {
                document.getElementById('remote-video').srcObject = remote;
            });
        });
        
        // 4. MAKING A CALL
        async function startCall() {
            const destId = document.getElementById("remote-id").value;
            if (!destId) return alert("Enter an ID");
        
            const stream = await getStream();
            const call = peer.call(destId, stream);
            
            call.on("stream", remote => {
                document.getElementById('remote-video').srcObject = remote;
            });
        }

    </script>
</body>
</html>
